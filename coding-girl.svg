<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1e3a"/><stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <rect width="480" height="340" rx="18" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.5"><animate attributeName="opacity" values="1;.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="60" r="1.8"><animate attributeName="opacity" values=".1;1;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="120" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="150" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="25" r="1.2"><animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- floating symbols -->
  <g font-family="monospace" font-size="20" font-weight="bold">
    <text x="50" y="200" fill="#00e5ff">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="3s" repeatCount="indefinite"/></text>
    <text x="400" y="220" fill="#ff4fd8">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,-16;0,0" dur="3.6s" repeatCount="indefinite"/></text>
    <text x="410" y="120" fill="#ffd600">AI<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="2.8s" repeatCount="indefinite"/></text>
    <text x="30" y="110" fill="#69f0ae">py<animateTransform attributeName="transform" type="translate" values="0,0;0,-12;0,0" dur="3.3s" repeatCount="indefinite"/></text>
  </g>
  <!-- desk -->
  <rect x="40" y="270" width="400" height="12" rx="6" fill="#2a2150"/>
  <rect x="60" y="282" width="10" height="40" fill="#2a2150"/><rect x="410" y="282" width="10" height="40" fill="#2a2150"/>
  <!-- laptop -->
  <g>
    <rect x="215" y="150" width="190" height="115" rx="8" fill="#1c1c2e" stroke="#00e5ff" stroke-width="2">
      <animate attributeName="stroke" values="#00e5ff;#ff4fd8;#7c4dff;#00e5ff" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="223" y="158" width="174" height="99" rx="4" fill="url(#scr)"/>
    <g font-family="monospace" font-size="9">
      <text x="231" y="175" fill="#ff4fd8">import <tspan fill="#00e5ff">torch</tspan></text>
      <text x="231" y="190" fill="#69f0ae">model = Net()</text>
      <text x="231" y="205" fill="#ffd600">for epoch in range(100):</text>
      <text x="241" y="220" fill="#00e5ff">loss.backward()</text>
      <text x="241" y="235" fill="#ff4fd8">print("Level Up!")</text>
      <rect x="337" y="228" width="6" height="10" fill="#fff"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect>
    </g>
    <!-- screen scan -->
    <rect x="223" y="158" width="174" height="6" fill="#00e5ff" opacity=".15">
      <animate attributeName="y" values="158;251;158" dur="3s" repeatCount="indefinite"/>
    </rect>
    <path d="M200 265 H420 L410 272 H210 Z" fill="#2f2f4a"/>
  </g>
  <!-- chair -->
  <rect x="95" y="215" width="14" height="60" rx="6" fill="#7c4dff"/>
  <!-- girl body -->
  <path d="M110 270 Q105 215 150 205 Q190 205 195 270 Z" fill="#7c4dff"/>
  <!-- hair back -->
  <path d="M120 120 Q150 70 190 110 Q205 160 190 200 L125 200 Q105 160 120 120Z" fill="url(#hair)"/>
  <!-- head -->
  <circle cx="158" cy="135" r="30" fill="#ffd9c0"/>
  <!-- fringe -->
  <path d="M125 130 Q140 90 185 120 Q165 112 150 125 Q138 112 125 130Z" fill="url(#hair)"/>
  <!-- headphones -->
  <path d="M125 135 Q158 80 191 135" fill="none" stroke="#00e5ff" stroke-width="5"/>
  <rect x="119" y="128" width="12" height="22" rx="5" fill="#00e5ff"/>
  <rect x="185" y="128" width="12" height="22" rx="5" fill="#00e5ff"/>
  <!-- face -->
  <g>
    <ellipse cx="170" cy="138" rx="3.5" ry="4.5" fill="#222">
      <animate attributeName="ry" values="4.5;4.5;0.5;4.5;4.5" keyTimes="0;.85;.9;.95;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="186" cy="138" rx="3.5" ry="4.5" fill="#222">
      <animate attributeName="ry" values="4.5;4.5;0.5;4.5;4.5" keyTimes="0;.85;.9;.95;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="163" cy="148" r="4" fill="#ff8fab" opacity=".6"/>
    <path d="M172 152 Q178 158 184 152" stroke="#c2185b" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- arm + typing hand -->
  <path d="M170 235 Q205 245 232 252" stroke="#7c4dff" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="236" cy="253" r="8" fill="#ffd9c0">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0;0,-2;0,0" dur="0.4s" repeatCount="indefinite"/>
  </circle>
  <path d="M175 225 Q215 232 246 246" stroke="#6a3de8" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="250" cy="248" r="7" fill="#ffd9c0">
    <animateTransform attributeName="transform" type="translate" values="0,-3;0,0;0,-3" dur="0.3s" repeatCount="indefinite"/>
  </circle>
  <!-- coffee -->
  <rect x="75" y="248" width="20" height="22" rx="4" fill="#fff"/>
  <path d="M95 254 Q104 258 95 264" stroke="#fff" stroke-width="3" fill="none"/>
  <path d="M80 244 Q84 236 80 230" stroke="#aaa" stroke-width="2" fill="none" opacity=".7">
    <animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/>
  </path>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
