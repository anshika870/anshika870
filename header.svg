<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a1f"/>
      <stop offset="0.5" stop-color="#1a0b3a"/>
      <stop offset="1" stop-color="#06222e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ff4fd8;#ffd600;#00e5ff" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff4fd8"><animate attributeName="stop-color" values="#ff4fd8;#ffd600;#00e5ff;#ff4fd8" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c4dff" stroke-opacity=".25" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;0 40" dur="2s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="1000" height="280" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>
    <!-- glowing orbs -->
    <circle cx="120" cy="60" r="70" fill="#ff4fd8" opacity=".18"><animate attributeName="cy" values="60;90;60" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="220" r="90" fill="#00e5ff" opacity=".18"><animate attributeName="cy" values="220;190;220" dur="6s" repeatCount="indefinite"/></circle>
    <!-- pixel stars / coins -->
    <g fill="#ffd600">
      <rect x="80" y="200" width="10" height="10"><animate attributeName="y" values="200;185;200" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="910" y="50" width="10" height="10"><animate attributeName="y" values="50;65;50" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="840" y="120" width="8" height="8" fill="#69f0ae"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="160" y="130" width="8" height="8" fill="#ff4fd8"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></rect>
    </g>
    <!-- top HUD -->
    <g font-family="'Courier New',monospace" font-size="14" font-weight="bold">
      <text x="30" y="35" fill="#00e5ff">♥ ♥ ♥</text>
      <text x="850" y="35" fill="#ffd600">LVL 99</text>
      <text x="415" y="35" fill="#69f0ae" letter-spacing="3">PLAYER 1 READY</text>
    </g>
    <!-- title -->
    <text x="500" y="135" text-anchor="middle" font-family="'Courier New',monospace" font-size="70" font-weight="900" letter-spacing="6" fill="url(#title)" filter="url(#glow)">ANSHIKA BAJPAI</text>
    <!-- subtitle -->
    <text x="500" y="180" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="3">SOFTWARE ENGINEER  •  JAVA BACKEND  •  AI / ML
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
    </text>
    <!-- press start -->
    <text x="500" y="235" text-anchor="middle" font-family="'Courier New',monospace" font-size="18" font-weight="bold" fill="#ffd600" letter-spacing="4">▶ PRESS START TO EXPLORE
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
    <!-- scanline -->
    <rect width="1000" height="3" fill="#00e5ff" opacity=".25"><animate attributeName="y" values="0;280;0" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="3" y="3" width="994" height="274" rx="18" fill="none" stroke="url(#title)" stroke-width="3"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
